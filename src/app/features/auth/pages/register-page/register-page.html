<section class="mx-auto max-w-2xl px-5 py-14 sm:py-20">
  <p class="text-sm font-semibold tracking-[0.18em] text-rose-700 uppercase">Nueva cuenta</p>
  <h1 class="mt-3 text-3xl font-bold tracking-tight">Regístrate como cliente</h1>
  <p class="mt-2 text-stone-600">Tu cuenta recibirá únicamente el rol cliente.</p>

  <form [formGroup]="form" class="mt-8 grid gap-5 rounded-3xl border border-stone-200 bg-white p-6 shadow-sm sm:grid-cols-2" (ngSubmit)="submit()">
    <label class="grid gap-2 text-sm font-semibold">
      Nombres
      <input formControlName="nombres" autocomplete="given-name" class="rounded-xl border border-stone-300 px-4 py-3 font-normal" />
    </label>
    <label class="grid gap-2 text-sm font-semibold">
      Apellidos
      <input formControlName="apellidos" autocomplete="family-name" class="rounded-xl border border-stone-300 px-4 py-3 font-normal" />
    </label>
    <label class="grid gap-2 text-sm font-semibold sm:col-span-2">
      Correo electrónico
      <input type="email" formControlName="email" autocomplete="email" class="rounded-xl border border-stone-300 px-4 py-3 font-normal" />
    </label>
    <label class="grid gap-2 text-sm font-semibold">
      Teléfono (opcional)
      <input formControlName="telefono" autocomplete="tel" class="rounded-xl border border-stone-300 px-4 py-3 font-normal" />
    </label>
    <label class="grid gap-2 text-sm font-semibold">
      Dirección (opcional)
      <input formControlName="direccion" autocomplete="street-address" class="rounded-xl border border-stone-300 px-4 py-3 font-normal" />
    </label>
    <label class="grid gap-2 text-sm font-semibold sm:col-span-2">
      Contraseña
      <input type="password" formControlName="password" autocomplete="new-password" class="rounded-xl border border-stone-300 px-4 py-3 font-normal" />
      <small class="font-normal text-stone-500">Mínimo 8 caracteres.</small>
    </label>

    @if (errorMessage()) {
      <p class="rounded-xl bg-red-50 p-3 text-sm text-red-700 sm:col-span-2" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()" class="rounded-xl bg-rose-700 px-5 py-3 font-semibold text-white disabled:opacity-60 sm:col-span-2">
      {{ loading() ? 'Creando cuenta…' : 'Crear mi cuenta' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-stone-600">
    ¿Ya tienes cuenta? <a routerLink="/auth/login" class="font-semibold text-rose-700">Inicia sesión</a>
  </p>
</section>
