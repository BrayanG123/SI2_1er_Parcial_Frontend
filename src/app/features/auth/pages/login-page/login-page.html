<section class="mx-auto max-w-md px-5 py-14 sm:py-20">
  <p class="text-sm font-semibold tracking-[0.18em] text-rose-700 uppercase">Bienvenido</p>
  <h1 class="mt-3 text-3xl font-bold tracking-tight">Inicia sesión</h1>
  <p class="mt-2 text-stone-600">Accede con tu correo y contraseña.</p>

  <form [formGroup]="form" class="mt-8 grid gap-5 rounded-3xl border border-stone-200 bg-white p-6 shadow-sm" (ngSubmit)="submit()">
    <label class="grid gap-2 text-sm font-semibold">
      Correo electrónico
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        class="rounded-xl border border-stone-300 px-4 py-3 font-normal outline-none focus:border-rose-600 focus:ring-2 focus:ring-rose-100"
      />
    </label>
    <label class="grid gap-2 text-sm font-semibold">
      Contraseña
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="rounded-xl border border-stone-300 px-4 py-3 font-normal outline-none focus:border-rose-600 focus:ring-2 focus:ring-rose-100"
      />
    </label>

    @if (errorMessage()) {
      <p class="rounded-xl bg-red-50 p-3 text-sm text-red-700" role="alert">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-xl bg-rose-700 px-5 py-3 font-semibold text-white disabled:cursor-wait disabled:opacity-60"
    >
      {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-stone-600">
    ¿No tienes cuenta?
    <a routerLink="/auth/registro" class="font-semibold text-rose-700">Regístrate</a>
  </p>
</section>
